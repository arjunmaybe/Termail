name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: checkout, install, lint, typecheck, build and test
# need repository read access only.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        # Pinned to actions/checkout v7 (verified upstream tag SHA).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        # Pinned to oven-sh/setup-bun v2 (verified upstream tag SHA).
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to the version in packageManager for reproducible CI.
          bun-version: 1.4.1

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test:sequential
